
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta name="description" content="Explore Edapt Store for innovative technology, artificial intelligence, coding, robotics textbooks, 3D printers, and STEM lab products. Shop online for educational tools.">
  <meta name="keywords" content="STEM, Hello Ai text books, Hello Ai, Edapt Learning Technologies, Edapt, Edapt Store, AI textbooks, coding books, robotics, STEM lab, 3D printer, educational technology, online store, tech solutions, India, malappuram, kerala, Technology, education,Umer,Abdussalam, Umer Abdussalam, Nishad, Nishadt, education technology">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: '#1e40af',
            secondary: '#3b82f6',
            accent: '#f59e0b',
            dark: '#1f2937'
          },
          animation: {
            'fade-in': 'fadeIn 0.5s ease-in-out',
            'slide-up': 'slideUp 0.6s ease-out',
            'bounce-gentle': 'bounceGentle 2s infinite',
            'cart-highlight': 'cartHighlight 0.6s ease-in-out'
          }
        }
      }
    }
  </script>
  <style>
    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }
    @keyframes slideUp {
      from { transform: translateY(20px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }
    @keyframes bounceGentle {
      0%, 20%, 50%, 80%, 100% { transform: translateY(0); }
      40% { transform: translateY(-5px); }
      60% { transform: translateY(-3px); }
    }
    @keyframes cartHighlight {
      0% { transform: scale(1); filter: brightness(1); }
      50% { transform: scale(1.1); filter: brightness(1.3); }
      100% { transform: scale(1); filter: brightness(1); }
    }
    .gradient-bg {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    }
    .glass-effect {
      backdrop-filter: blur(10px);
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.2);
    }
    .product-card {
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .product-card:hover {
      transform: translateY(-8px);
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
    }
    .floating-cart {
      animation: bounceGentle 3s infinite;
    }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/prop-types/15.8.1/prop-types.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
  <script src="https://unpkg.com/papaparse@latest/papaparse.min.js"></script>
</head>
<body class="bg-gray-50">
  <div id="root"></div>

  <script type="text/babel">
    const csvData = `
ID,Name,Image,Price,Stock,Category,Description

`;

    // Product Detail Modal Component
    const ProductDetailModal = ({ product, onClose, addToCart, cart, toggleCart }) => {
      if (!product) return null;
      const isInCart = cart.some(item => item.ID === product.ID);
      return (
        <div className="fixed inset-0 bg-black bg-opacity-75 flex items-center justify-center z-50 animate-fade-in p-4">
          <div className="bg-white rounded-xl shadow-2xl p-6 md:p-8 max-w-2xl w-full mx-auto relative transform animate-slide-up">
            <button onClick={onClose} className="absolute top-3 right-3 md:top-4 md:right-4 text-gray-500 hover:text-gray-700 text-3xl font-light">&times;</button>
            <div className="flex flex-col md:flex-row gap-6">
              <div className="md:w-1/2"><img src={product.Image} alt={product.Name} className="w-full h-auto object-contain rounded-lg shadow-sm max-h-[60vh] md:max-h-full" /></div>
              <div className="md:w-1/2 flex flex-col justify-between">
                <div>
                  <h2 className="text-2xl md:text-3xl font-bold text-gray-900 mb-2">{product.Name}</h2>
                  <p className="text-gray-600 mb-4 text-sm md:text-base">{product.Description}</p>
                  <div className="flex flex-col sm:flex-row sm:items-center sm:justify-between mb-4">
                    <span className="text-3xl md:text-4xl font-extrabold text-blue-700 mb-2 sm:mb-0">₹{parseFloat(product.Price).toLocaleString()}</span>
                    <span className={`px-3 py-1 text-xs md:text-sm font-semibold rounded-full ${product.Stock === "in" ? 'bg-green-100 text-green-800' : 'bg-red-100 text-red-800'}`}>{product.Stock === "in" ? 'In Stock' : 'Out of Stock'}</span>
                  </div>
                  <div className="flex items-center space-x-1 mb-4">
                    {[...Array(5)].map((_, i) => (<svg key={i} className="w-5 h-5 text-yellow-400" fill="currentColor" viewBox="0 0 20 20"><path d="M9.049 2.927c.3-.921 1.603-.921 1.902 0l1.07 3.292a1 1 0 00.95.69h3.462c.969 0 1.371 1.24.588 1.81l-2.8 2.034a1 1 0 00-.364 1.118l1.07 3.292c.3.921-.755 1.688-1.54 1.118l-2.8-2.034a1 1 0 00-1.175 0l-2.8 2.034c-.784.57-1.838-.197-1.539-1.118l1.07-3.292a1 1 0 00-.364-1.118L2.98 8.72c-.783-.57-.38-1.81.588-1.81h3.461a1 1 0 00.951-.69l1.07-3.292z" /></svg>))}
                    <span className="text-sm text-gray-500 ml-1">(4.5)</span>
                  </div>
                  <p className="text-sm text-gray-500">Category: <span className="font-medium text-gray-700">{product.Category}</span></p>
                </div>
                <button
                  className={`w-full py-3 px-4 mt-6 rounded-lg font-medium transition-all duration-200 text-sm md:text-base ${product.Stock === "in" ? (isInCart ? "bg-green-500 text-white hover:bg-green-600 transform hover:scale-105" : "bg-gradient-to-r from-blue-600 to-purple-600 text-white hover:shadow-lg transform hover:scale-105") : "bg-gray-200 text-gray-500 cursor-not-allowed"}`}
                  onClick={() => { if (product.Stock === "in") { if (isInCart) { toggleCart(); onClose(); } else { addToCart(product); } } }}
                  disabled={product.Stock !== "in"}
                >
                  {product.Stock === "in" ? (isInCart ? "View Cart" : "Add to Cart") : "Out of Stock"}
                </button>
              </div>
            </div>
          </div>
        </div>
      );
    };

    // Enhanced Cart Sidebar
    const CartSidebar = ({ cart, removeFromCart, isCartOpen, toggleCart, checkout, updateQuantity, onProductClick }) => {
      const total = cart.reduce((sum, item) => sum + (parseFloat(item.Price) * item.quantity), 0);
      const itemCount = cart.reduce((sum, item) => sum + item.quantity, 0);
      return (
        <>
          {isCartOpen && <div className="fixed inset-0 bg-black bg-opacity-50 z-40" onClick={toggleCart}></div>}
          <div className={`fixed top-0 right-0 h-full w-full sm:w-96 bg-white shadow-2xl transform transition-transform duration-300 z-50 ${isCartOpen ? 'translate-x-0' : 'translate-x-full'}`}>
            <div className="flex flex-col h-full">
              <div className="p-3 sm:p-4 border-b border-gray-200">
                <div className="flex justify-between items-center"><h2 className="text-lg sm:text-xl font-bold text-gray-800">Shopping Cart</h2><button onClick={toggleCart} className="text-gray-500 hover:text-gray-700 text-2xl">×</button></div>
                <p className="text-xs sm:text-sm text-gray-500 mt-1">{itemCount} items</p>
              </div>
              <div className="flex-1 overflow-y-auto p-3 sm:p-4">

                  <div className="text-center py-12">

                    <p className="text-gray-500 text-sm sm:text-base">Your cart is empty</p><p className="text-xs sm:text-sm text-gray-400 mt-2">Add some products to get started</p>
                  </div>
                ) : (
                  <div className="space-y-4">
                    {cart.map((item, index) => (
                      <div key={index} className="flex items-center space-x-3 sm:space-x-4 p-3 sm:p-4 bg-gray-50 rounded-lg cursor-pointer" onClick={() => { onProductClick(item); toggleCart(); }}>
                        <img src={item.Image} alt={item.Name} className="w-12 h-12 sm:w-16 h-16 object-cover rounded-lg" />
                        <div className="flex-1">
                          <h3 className="font-medium text-sm sm:text-base text-gray-800 line-clamp-2">{item.Name}</h3>
                          <p className="text-xs sm:text-sm text-gray-500">₹{parseFloat(item.Price).toLocaleString()}</p>
                          <div className="flex items-center mt-1 sm:mt-2 space-x-2" onClick={(e) => e.stopPropagation()}> {/* Stop propagation to prevent modal open when changing quantity */}
                            <button onClick={() => updateQuantity(index, Math.max(1, item.quantity - 1))} className="w-5 h-5 sm:w-6 sm:h-6 rounded-full bg-gray-200 flex items-center justify-center text-xs sm:text-sm">−</button>
                            <span className="text-xs sm:text-sm font-medium">{item.quantity}</span>
                            <button onClick={() => updateQuantity(index, item.quantity + 1)} className="w-5 h-5 sm:w-6 sm:h-6 rounded-full bg-gray-200 flex items-center justify-center text-xs sm:text-sm">+</button>
                          </div>
                        </div>
                        <button onClick={(e) => { e.stopPropagation(); removeFromCart(index); }} className="text-red-500 hover:text-red-700"><svg className="w-4 h-4 sm:w-5 sm:h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" /></svg></button>
                      </div>
                    ))}
                  </div>
                )}
              </div>
              {cart.length > 0 && (
                <div className="p-3 sm:p-4 border-t border-gray-200 bg-gray-50">
                  <div className="space-y-3">
                    <div className="flex justify-between text-xs sm:text-sm"><span>Subtotal</span><span>₹{total.toLocaleString()}</span></div>
                    <div className="flex justify-between text-xs sm:text-sm"><span>Shipping</span><span className={total > 5000 ? 'text-green-600' : ''}>{total > 5000 ? 'Free' : '₹90'}</span></div>
                    <div className="border-t pt-3"><div className="flex justify-between font-bold text-sm sm:text-lg"><span>Total</span><span>₹{(total + (total > 5000 ? 0 : 90)).toLocaleString()}</span></div></div>
                    {total <= 5000 && (<p className="text-xs text-blue-600 bg-blue-50 p-2 rounded">Add ₹{(5000 - total).toLocaleString()} more for free shipping!</p>)}
                    <button onClick={checkout} className="w-full bg-gradient-to-r from-blue-600 to-purple-600 text-white py-2.5 sm:py-3 rounded-lg font-medium hover:shadow-lg transform hover:scale-105 transition-all duration-200 text-sm sm:text-base">Purchase through WhatsApp</button>
                  </div>
                </div>
              )}
            </div>
          </div>
        </>
      );
    };

    // Product Card
    const ProductCard = ({ product, addToCart, cart, toggleCart, onProductClick }) => {
      const [imageLoaded, setImageLoaded] = React.useState(false);
      const isInCart = cart.some(item => item.ID === product.ID);
      return (
        <div className="product-card bg-white rounded-xl shadow-md overflow-hidden hover:shadow-xl cursor-pointer flex flex-col h-full" onClick={() => onProductClick(product)}>
          <div className="relative">
            <div className="w-40 h-40 mx-auto flex items-center justify-center bg-white p-2"> 
              {!imageLoaded && (<div className="animate-pulse bg-gray-200 w-full h-full"></div>)}
              <img src={product.Image} alt={product.Name} className={`max-w-full max-h-full object-contain transition-opacity duration-300 ${imageLoaded ? 'opacity-100' : 'opacity-0'}`} onLoad={() => setImageLoaded(true)} onError={(e) => { e.target.src = "https://images.unsplash.com/photo-1518314916381-77a37c2a49ae?w=300"; setImageLoaded(true); }}/>
            </div>
            <div className="absolute top-2 left-2 sm:top-3 sm:left-3"><span className={`px-2 py-1 text-xs font-medium rounded-full ${product.Stock === "in" ? 'bg-green-100 text-green-800' : 'bg-red-100 text-red-800'}`}>{product.Stock === "in" ? 'In Stock' : 'Out of Stock'}</span></div>
            <div className="absolute top-2 right-2 sm:top-3 sm:right-3"><span className="px-2 py-1 text-xs font-medium bg-blue-100 text-blue-800 rounded-full">{product.Category}</span></div>
          </div>
          <div className="p-3 sm:p-4 flex flex-col flex-grow">
            <h3 className="text-sm sm:text-base font-semibold text-gray-800 mb-1 sm:mb-2 line-clamp-1">{product.Name}</h3>
            <p className="text-xs sm:text-sm text-gray-600 mb-3 sm:mb-4 line-clamp-2 flex-grow">{product.Description}</p>
            <div className="flex items-center justify-between mb-3 sm:mb-4">
              <div className="text-xl sm:text-2xl font-bold text-blue-600">₹{parseFloat(product.Price).toLocaleString()}</div>
              <div className="flex items-center space-x-1">
                {[...Array(5)].map((_, i) => (<svg key={i} className="w-3 h-3 sm:w-4 sm:h-4 text-yellow-400" fill="currentColor" viewBox="0 0 20 20"><path d="M9.049 2.927c.3-.921 1.603-.921 1.902 0l1.07 3.292a1 1 0 00.95.69h3.462c.969 0 1.371 1.24.588 1.81l-2.8 2.034a1 1 0 00-.364 1.118l1.07 3.292c.3.921-.755 1.688-1.54 1.118l-2.8-2.034a1 1 0 00-1.175 0l-2.8 2.034c-.784.57-1.838-.197-1.539-1.118l1.07-3.292a1 1 0 00-.364-1.118L2.98 8.72c-.783-.57-.38-1.81.588-1.81h3.461a1 1 0 00.951-.69l1.07-3.292z" /></svg>))}

              </div>
            </div>
            <button
              className={`w-full py-2.5 sm:py-3 px-4 rounded-lg font-medium transition-all duration-200 text-sm sm:text-base ${product.Stock === "in" ? (isInCart ? "bg-green-500 text-white hover:bg-green-600 transform hover:scale-105" : "bg-gradient-to-r from-blue-600 to-purple-600 text-white hover:shadow-lg transform hover:scale-105") : "bg-gray-200 text-gray-500 cursor-not-allowed"}`}
              onClick={(e) => { e.stopPropagation(); if (product.Stock === "in") { if (isInCart) { toggleCart(); } else { addToCart(product); } } }}
              disabled={product.Stock !== "in"}
            >
              {product.Stock === "in" ? (isInCart ? "View Cart" : "Add to Cart") : "Out of Stock"}
            </button>
          </div>
        </div>
      );
    };

    // About Section
    const AboutSection = () => { 
      return (
        <section id="about" className="py-16 sm:py-20 bg-gray-900 text-white">
          <div className="w-full px-4 sm:px-6 lg:px-8">
            <div className="max-w-4xl mx-auto text-center">
              <h2 className="text-3xl sm:text-4xl font-bold mb-6 sm:mb-8">About Edapt Shop</h2>
              <p className="text-lg sm:text-xl mb-8 sm:mb-12 opacity-90">Leading the revolution in technology solutions with innovative products that bridge the gap between imagination and reality.</p>
              <div className="grid md:grid-cols-3 gap-8">
                <div className="text-center">
                  <div className="w-12 h-12 sm:w-16 sm:h-16 bg-blue-600 rounded-full flex items-center justify-center mx-auto mb-3 sm:mb-4">
                    <svg className="w-6 h-6 sm:w-8 sm:h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M13 10V3L4 14h7v7l9-11h-7z" /></svg>
                  </div>
                  <h3 className="text-lg sm:text-xl font-semibold mb-1 sm:mb-2">Innovation</h3><p className="opacity-80 text-sm sm:text-base">Cutting-edge technology solutions for the modern world</p>
                </div>
                <div className="text-center">
                  <div className="w-12 h-12 sm:w-16 sm:h-16 bg-purple-600 rounded-full flex items-center justify-center mx-auto mb-3 sm:mb-4">
                    <svg className="w-6 h-6 sm:w-8 sm:h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z" /></svg>
                  </div>
                  <h3 className="text-lg sm:text-xl font-semibold mb-1 sm:mb-2">Quality</h3><p className="opacity-80 text-sm sm:text-base">Premium products with rigorous testing and certification</p>
                </div>
                <div className="text-center">
                  <div className="w-12 h-12 sm:w-16 sm:h-16 bg-green-600 rounded-full flex items-center justify-center mx-auto mb-3 sm:mb-4">
                    <svg className="w-6 h-6 sm:w-8 sm:h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z" /></svg>
                  </div>
                  <h3 className="text-lg sm:text-xl font-semibold mb-1 sm:mb-2">Support</h3><p className="opacity-80 text-sm sm:text-base">24/7 expert support and comprehensive warranty coverage</p>
                </div>
              </div>
            </div>
          </div>
        </section>
      );
    };
    
    const FilterSidebar = ({ categories, filters, setFilters, isFilterOpen, toggleFilter }) => {
      const sidebarContent = (
        <div className="flex flex-col h-full">
          <div className="p-4 sm:p-5 border-b border-gray-200">

                  ))}
                </div>
              </div>
              <div>
                <h3 className="font-semibold mb-2.5 text-gray-700 text-sm sm:text-base">Price Range</h3>
                <div className="space-y-2">
                  <label className="flex items-center space-x-2 cursor-pointer"><input type="radio" name="price" value="all" checked={filters.priceRange === 'all'} onChange={() => setFilters(prev => ({ ...prev, priceRange: 'all' }))} className="text-blue-600 focus:ring-blue-500 h-4 w-4"/><span className="text-xs sm:text-sm text-gray-600">All Prices</span></label>
                  <label className="flex items-center space-x-2 cursor-pointer"><input type="radio" name="price" value="low" checked={filters.priceRange === 'low'} onChange={() => setFilters(prev => ({ ...prev, priceRange: 'low' }))} className="text-blue-600 focus:ring-blue-500 h-4 w-4"/><span className="text-xs sm:text-sm text-gray-600">Under ₹5,000</span></label>
                  <label className="flex items-center space-x-2 cursor-pointer"><input type="radio" name="price" value="mid" checked={filters.priceRange === 'mid'} onChange={() => setFilters(prev => ({ ...prev, priceRange: 'mid' }))} className="text-blue-600 focus:ring-blue-500 h-4 w-4"/><span className="text-xs sm:text-sm text-gray-600">₹5,000 - ₹20,000</span></label>
                  <label className="flex items-center space-x-2 cursor-pointer"><input type="radio" name="price" value="high" checked={filters.priceRange === 'high'} onChange={() => setFilters(prev => ({ ...prev, priceRange: 'high' }))} className="text-blue-600 focus:ring-blue-500 h-4 w-4"/><span className="text-xs sm:text-sm text-gray-600">Over ₹20,000</span></label>
                </div>
              </div>
              <div>
                <h3 className="font-semibold mb-2.5 text-gray-700 text-sm sm:text-base">Availability</h3>
                <div className="space-y-2">
                  <label className="flex items-center space-x-2 cursor-pointer"><input type="checkbox" checked={filters.inStockOnly} onChange={(e) => setFilters(prev => ({ ...prev, inStockOnly: e.target.checked }))} className="text-blue-600 focus:ring-blue-500 h-4 w-4 rounded"/><span className="text-xs sm:text-sm text-gray-600">In Stock Only</span></label>
                </div>
              </div>
              <div>
                <h3 className="font-semibold mb-2.5 text-gray-700 text-sm sm:text-base">Sort By</h3>
                <select value={filters.sortBy} onChange={(e) => setFilters(prev => ({ ...prev, sortBy: e.target.value }))} className="w-full p-2 border border-gray-300 rounded-lg text-xs sm:text-sm focus:ring-blue-500 focus:border-blue-500">
                  <option value="name-asc">Name (A-Z)</option><option value="name-desc">Name (Z-A)</option>
                  <option value="price-asc">Price (Low to High)</option><option value="price-desc">Price (High to Low)</option>
                </select>
              </div>
            </div>
          </div>
          <div className="p-4 border-t border-gray-200 bg-gray-50 lg:hidden">
            <button onClick={toggleFilter} className="w-full bg-blue-600 text-white py-2.5 rounded-lg font-medium hover:bg-blue-700 transition-colors text-sm sm:text-base">
              Apply Filters
            </button>
          </div>
        </div>
      );

      return (
        <>
          {isFilterOpen && <div className="fixed inset-0 bg-black bg-opacity-50 z-40 lg:hidden" onClick={toggleFilter}></div>}
          <div
            className={`
              bg-white
              ${ /* Small screens: fixed, sliding sidebar */''}
              fixed top-0 left-0 h-full w-full max-w-xs sm:w-80 shadow-2xl transform transition-transform duration-300 z-50
              ${isFilterOpen ? 'translate-x-0' : '-translate-x-full'}
              
              ${ /* Large screens: sticky panel */''}
              lg:sticky lg:top-16 ${/* Navbar height is h-16 (4rem) */''}
              lg:w-64 xl:w-72 lg:h-[calc(100vh-4rem)] ${/* Full viewport height minus navbar */''}
              lg:overflow-y-auto lg:flex-shrink-0
              lg:shadow-none lg:border-r lg:border-gray-200
              lg:transform-none lg:translate-x-0 lg:z-10
              ${!isFilterOpen ? 'hidden lg:block' : 'block'}
            `}
          >
            {sidebarContent}
          </div>
        </>
      );
    };


    // Main App Component
    const App = () => {
      const [products, setProducts] = React.useState([]);
      const [filters, setFilters] = React.useState({ category: "All", priceRange: "all", sortBy: "name-asc", inStockOnly: false });
      const [searchQuery, setSearchQuery] = React.useState("");
      const [cart, setCart] = React.useState([]);
      const [isCartOpen, setIsCartOpen] = React.useState(false);
      const [isFilterOpen, setIsFilterOpen] = React.useState(false);
      const [loading, setLoading] = React.useState(true);
      const [isMobileMenuOpen, setIsMobileMenuOpen] = React.useState(false);
      const [selectedProduct, setSelectedProduct] = React.useState(null);
      const [highlightCart, setHighlightCart] = React.useState(false);

      React.useEffect(() => {
        Papa.parse(csvData, {
          header: true, skipEmptyLines: true, transformHeader: (h) => h.trim(),
          transform: (v, h) => { const c = v.trim(); if (h === "Price") return isNaN(parseFloat(c)) ? 0 : parseFloat(c); return c; },
          complete: (res) => { setProducts(res.data); setLoading(false); },
          error: (err) => { console.error(err); setLoading(false); }
        });
      }, []);

      const addToCart = (product) => { 
        const existingItemIndex = cart.findIndex(item => item.ID === product.ID);
        if (existingItemIndex >= 0) {
          const newCart = [...cart]; newCart[existingItemIndex].quantity += 1; setCart(newCart);
        } else { setCart([...cart, { ...product, quantity: 1 }]); }
        setHighlightCart(true); setTimeout(() => setHighlightCart(false), 600);
      };
      const removeFromCart = (index) => setCart(cart.filter((_, i) => i !== index));
      const updateQuantity = (index, newQuantity) => { 
        if (newQuantity <= 0) { removeFromCart(index); }
        else { const newCart = [...cart]; newCart[index].quantity = newQuantity; setCart(newCart); }
      };
      const checkout = () => { 
        if (cart.length === 0) { /* Changed alert to console.error */ console.error("Your cart is empty!"); return; }
        const phoneNumber = "7356568721"; let message = "Hello Edapt Shop! I'd like to purchase the following items:\n\n";
        cart.forEach(item => { message += `${item.Name} (Quantity: ${item.quantity}) - ₹${parseFloat(item.Price).toLocaleString()}\n`; });
        const subTotal = cart.reduce((sum, item) => sum + (parseFloat(item.Price) * item.quantity), 0);
        const shippingCost = subTotal > 5000 ? 0 : 90; const finalTotal = subTotal + shippingCost;
        message += `\nSubtotal: ₹${subTotal.toLocaleString()}`; message += `\nShipping: ${shippingCost === 0 ? 'Free' : `₹${shippingCost.toLocaleString()}`}`; message += `\nTotal: ₹${finalTotal.toLocaleString()}`;
        const encodedMessage = encodeURIComponent(message); const whatsappUrl = `https://wa.me/${phoneNumber}?text=${encodedMessage}`;
        window.open(whatsappUrl, '_blank');
      };

      const toggleCart = () => setIsCartOpen(!isCartOpen);
      const toggleFilter = () => setIsFilterOpen(!isFilterOpen);
      const handleProductClick = (product) => setSelectedProduct(product);
      const closeProductDetailModal = () => setSelectedProduct(null);
      const scrollToSection = (sectionId) => {
        const element = document.getElementById(sectionId);
        if (element) {
          const navbarHeight = document.querySelector('nav')?.offsetHeight || 0; // typically 64px or 4rem
          const elementPosition = element.getBoundingClientRect().top + window.pageYOffset;
          // For sections like 'products', account for the filter bar potentially pushing content down differently on mobile vs desktop.
          // A fixed offset might be simpler if section headers are clear.
          let offsetPosition = elementPosition - navbarHeight - 20; // 20px additional spacing
          
          // If scrolling to products and on desktop view where filter bar is sticky
          // no special adjustment needed here as product section itself is laid out beside filter.
          
          window.scrollTo({ top: offsetPosition, behavior: 'smooth' });
        }
        setIsMobileMenuOpen(false);
      };

      // Function to scroll to the top of the page (home screen)
      const scrollToHome = () => {
        window.scrollTo({ top: 0, behavior: 'smooth' });
        setIsMobileMenuOpen(false); // Close mobile menu if open
      };


      const filteredProducts = products.filter((product) => {
          const matchesCategory = filters.category === "All" || product.Category === filters.category;
          const matchesStock = !filters.inStockOnly || product.Stock === "in";
          const matchesSearch = !searchQuery || product.Name.toLowerCase().includes(searchQuery.toLowerCase()) || product.Category.toLowerCase().includes(searchQuery.toLowerCase()) || product.Description.toLowerCase().includes(searchQuery.toLowerCase());
          let matchesPrice = true;
          if (filters.priceRange !== 'all') {
            const price = parseFloat(product.Price);
            switch (filters.priceRange) {
              case 'low': matchesPrice = price < 5000; break;
              case 'mid': matchesPrice = price >= 5000 && price <= 20000; break;
              case 'high': matchesPrice = price > 20000; break;
            }
          }
          return matchesCategory && matchesStock && matchesSearch && matchesPrice;
      }).sort((a, b) => { 
          switch (filters.sortBy) {
            case "price-asc": return parseFloat(a.Price) - parseFloat(b.Price);
            case "price-desc": return parseFloat(b.Price) - parseFloat(a.Price);
            case "name-asc": return a.Name.localeCompare(b.Name);
            case "name-desc": return b.Name.localeCompare(b.Name);
            default: return 0;
          }
      });

      const categories = ["All", ...new Set(products.map((p) => p.Category))];
      const cartCount = cart.reduce((sum, item) => sum + item.quantity, 0);

      return (
        <div className="min-h-screen bg-gray-50">
          <nav className="bg-white shadow-md py-2 fixed top-0 w-full z-30">
            <div className="w-full px-4 sm:px-6 lg:px-8 flex items-center justify-between h-16">
                <div className="flex items-center flex-grow min-w-0">
                    {/* MODIFIED: Added onClick to Edapt Logo for smooth scroll to home */}
                    <button onClick={scrollToHome} className="flex-shrink-0 mr-3 sm:mr-6 cursor-pointer focus:outline-none">
                        <img src="https://digitalskills.iitmpravartak.org.in/assets/images/learning/edapt/logo.png" alt="Edapt Logo" className="h-7 sm:h-8 w-auto"/>
                    </button>
                    <div className="relative flex-grow max-w-xl hidden sm:block">
                        <input type="text" placeholder="Search products..." className="w-full pl-10 pr-3 py-2 text-xs sm:text-sm border-2 border-gray-200 rounded-md bg-gray-100 focus:outline-none focus:border-blue-500" value={searchQuery} onChange={(e) => setSearchQuery(e.target.value)}/>
                        <div className="absolute left-3 top-1/2 transform -translate-y-1/2"><svg className="w-4 h-4 text-gray-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="m21 21-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" /></svg></div>
                    </div>
                </div>
                <div className="flex items-center space-x-1 sm:space-x-3 flex-shrink-0">
                    <button onClick={() => scrollToSection('products')} className="text-gray-700 hover:text-blue-600 hidden md:block text-sm font-medium px-2">Products</button>
                    <button onClick={() => scrollToSection('about')} className="text-gray-700 hover:text-blue-600 hidden md:block text-sm font-medium px-2">About</button>
                    <div className="relative group hidden md:block">
                        <button className="flex items-center text-gray-700 hover:text-blue-600 text-sm font-medium px-2 py-2">More<svg className="w-3 h-3 sm:w-4 sm:h-4 ml-1 transform group-hover:rotate-180 transition-transform duration-200" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M19 9l-7 7-7-7" /></svg></button>
                        <div className="absolute right-0 mt-1 w-48 bg-white border border-gray-200 rounded-md shadow-lg py-1 hidden group-hover:block z-40">
                            <a href="#" className="block px-4 py-2 text-xs sm:text-sm text-gray-700 hover:bg-gray-100">Notification Preferences</a><a href="#" className="block px-4 py-2 text-xs sm:text-sm text-gray-700 hover:bg-gray-100">24x7 Customer Care</a><a href="#" className="block px-4 py-2 text-xs sm:text-sm text-gray-700 hover:bg-gray-100">Advertise</a><a href="#" className="block px-4 py-2 text-xs sm:text-sm text-gray-700 hover:bg-gray-100">Download App</a>
                        </div>
                    </div>
                    {/* MODIFIED Filter Button: hidden on large screens */}
                    <button onClick={toggleFilter} title="Filters" className="flex items-center text-gray-700 hover:text-blue-600 p-1.5 sm:p-2 rounded-md focus:outline-none lg:hidden">
                      <svg className="w-5 h-5 sm:w-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M3 4a1 1 0 011-1h16a1 1 0 011 1v2a1 1 0 01-.293.707L16 11.414V17l-4 2v-7.586L3.293 6.707A1 1 0 013 6V4z"></path></svg>
                      <span className="hidden sm:inline ml-1 text-sm font-medium">Filters</span>
                    </button>
                    <button onClick={toggleCart} title="Cart" className={`relative flex items-center text-gray-700 hover:text-blue-600 p-1.5 sm:p-2 rounded-md ${cartCount > 0 ? 'floating-cart' : ''} ${highlightCart ? 'animate-cart-highlight' : ''}`}>
                      <svg className="w-5 h-5 sm:w-6 sm:h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M3 3h2l.4 2M7 13h10l4-8H5.4M7 13L5.4 5M7 13l-2.293 2.293c-.63.63-.184 1.707.707 1.707H17m0 0a2 2 0 100 4 2 2 0 000-4zm-8 2a2 2 0 11-4 0 2 2 0 014 0z" /></svg>
                      <span className="hidden sm:inline ml-1 text-sm font-medium">Cart</span>
                      {cartCount > 0 && (<span className="absolute -top-1 -right-1 sm:-top-2 sm:-right-2 bg-red-500 text-white rounded-full w-4 h-4 sm:w-5 sm:h-5 flex items-center justify-center text-xs font-bold animate-pulse">{cartCount}</span>)}
                    </button>
                    <button className="lg:hidden p-2 text-gray-700 hover:text-blue-600" onClick={() => setIsMobileMenuOpen(!isMobileMenuOpen)}>
                        <svg className="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">{isMobileMenuOpen ? (<path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M6 18L18 6M6 6l12 12" />) : (<path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M4 6h16M4 12h16M4 18h16" />)}</svg>
                    </button>
                </div>
            </div>
            <div className="sm:hidden px-4 pb-2">
                <div className="relative">
                    <input type="text" placeholder="Search products..." className="w-full pl-10 pr-3 py-2 text-sm border-2 border-gray-200 rounded-md bg-gray-100 focus:outline-none focus:border-blue-500" value={searchQuery} onChange={(e) => setSearchQuery(e.target.value)}/>
                    <div className="absolute left-3 top-1/2 transform -translate-y-1/2"><svg className="w-4 h-4 text-gray-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="m21 21-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" /></svg></div>
                </div>
            </div>
            <div className={`lg:hidden ${isMobileMenuOpen ? 'block' : 'hidden'} bg-white border-t border-gray-200 py-2 px-4 absolute w-full shadow-lg`}>
                <div className="space-y-2">
                    <button onClick={() => scrollToSection('products')} className="block w-full text-left py-2 text-gray-700 font-medium hover:text-blue-600 hover:bg-gray-50 rounded px-2">Products</button>
                    <button onClick={() => scrollToSection('about')} className="block w-full text-left py-2 text-gray-700 font-medium hover:text-blue-600 hover:bg-gray-50 rounded px-2">About</button>
                    <div className="border-t border-gray-100 pt-2 mt-2">
                        <a href="#" className="block py-2 text-sm text-gray-700 hover:bg-gray-50 rounded px-2">Notification Preferences</a><a href="#" className="block py-2 text-sm text-gray-700 hover:bg-gray-50 rounded px-2">24x7 Customer Care</a><a href="#" className="block py-2 text-sm text-gray-700 hover:bg-gray-50 rounded px-2">Download Edapt App</a>
                    </div>
                </div>
            </div>
          </nav>

          <CartSidebar cart={cart} removeFromCart={removeFromCart} isCartOpen={isCartOpen} toggleCart={toggleCart} checkout={checkout} updateQuantity={updateQuantity} onProductClick={handleProductClick}/>
          {/* FilterSidebar is now rendered within the product section layout */}
          {selectedProduct && (<ProductDetailModal product={selectedProduct} onClose={closeProductDetailModal} addToCart={addToCart} cart={cart} toggleCart={toggleCart}/>)}

          {/* MODIFIED: Adjusted padding top to consistently be 4rem (h-16 of navbar) from sm breakpoint up */}
          <div className="pt-28 sm:pt-16">
            <section id="products" className="py-8 sm:py-12">
              <div className="w-full px-4 sm:px-6 lg:px-8">
                {loading ? (
                  <div className="flex justify-center items-center py-20"><div className="animate-spin rounded-full h-12 w-12 sm:h-16 sm:w-16 border-b-2 border-blue-600"></div></div>
                ) : (
                  // MODIFIED: Flex container for filter sidebar and product grid
                  <div className="flex flex-col lg:flex-row lg:gap-8">
                    <FilterSidebar
                      categories={categories}
                      filters={filters}
                      setFilters={setFilters}
                      isFilterOpen={isFilterOpen}
                      toggleFilter={toggleFilter}
                    />
                    {/* Product Grid Area takes remaining space */}
                    <div className="w-full lg:flex-1 mt-8 lg:mt-0">
                      <div className="flex flex-col sm:flex-row justify-between items-start sm:items-center mb-4 sm:mb-6 gap-2">
                        <p className="text-xs sm:text-sm text-gray-600">Showing {filteredProducts.length} of {products.length} products</p>
                      </div>
                      <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4 sm:gap-6"> {/* Maintained lg:grid-cols-4 for product density */}
                        {filteredProducts.length > 0 ? (
                          filteredProducts.map((product) => (<div key={product.ID} className="animate-slide-up"><ProductCard product={product} addToCart={addToCart} cart={cart} toggleCart={toggleCart} onProductClick={handleProductClick}/></div>))
                        ) : (
                          <div className="col-span-full text-center py-12">
                            <svg className="w-12 h-12 sm:w-16 sm:h-16 text-gray-300 mx-auto mb-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M9.172 16.172a4 4 0 015.656 0M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" /></svg>
                            <h3 className="text-lg sm:text-xl font-semibold text-gray-600 mb-2">No products found</h3><p className="text-sm sm:text-base text-gray-500">Try adjusting your filters or search query</p>
                          </div>
                        )}
                      </div>
                    </div>
                  </div>
                )}
              </div>
            </section>
          </div>
          <AboutSection />
          <footer className="bg-gray-900 text-white py-12 sm:py-16">
            <div className="w-full px-4 sm:px-6 lg:px-8">
              <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-8 mb-8">
                <div>
                  <div className="flex items-center space-x-2 mb-4"><img src="https://digitalskills.iitmpravartak.org.in/assets/images/learning/edapt/logo.png" alt="Edapt Logo" className="h-8 w-auto filter brightness-0 invert"/><h3 className="text-xl font-bold"></h3></div>
                  <p className="text-gray-400 text-sm mb-4">Leading innovation in technology solutions for a smarter tomorrow.</p>
                </div>
                <div>
                  <h4 className="text-sm sm:text-base font-semibold mb-3 sm:mb-4">Quick Links</h4>
                  <ul className="space-y-1.5 sm:space-y-2 text-gray-400">
                    <li><a href="#products" className="hover:text-white transition text-sm" onClick={(e) => {e.preventDefault(); scrollToSection('products');}}>Products</a></li>
                    <li><a href="#about" className="hover:text-white transition text-sm" onClick={(e) => {e.preventDefault(); scrollToSection('about');}}>About Us</a></li>
                    <li><a href="#" className="hover:text-white transition text-sm">Contact</a></li>
                  </ul>
                </div>
                <div>
                  <h4 className="text-sm sm:text-base font-semibold mb-3 sm:mb-4">Categories</h4>
                  <ul className="space-y-1.5 sm:space-y-2 text-gray-400">
                    {categories.slice(1,6).map(cat => (<li key={cat}><a href="#" className="hover:text-white transition text-sm" onClick={(e) => { e.preventDefault(); setFilters(prev => ({ ...prev, category: cat })); scrollToSection('products');}}>{cat}</a></li>))}
                  </ul>
                </div>
                <div>
                  <h4 className="text-sm sm:text-base font-semibold mb-3 sm:mb-4">Contact Info</h4>
                  <div className="space-y-1.5 sm:space-y-2 text-gray-400 text-sm">
                    <p className="flex items-center"><svg className="w-4 h-4 mr-2 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M3 8l7.89 4.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z" /></svg>hello@edapt.me</p>
                    <p className="flex items-center"><svg className="w-4 h-4 mr-2 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z" /></svg> +91 7356568721</p>
                  </div>
                </div>
              </div>
              <div className="border-t border-gray-800 pt-6 sm:pt-8">
                <div className="flex flex-col md:flex-row justify-between items-center">
                  <p className="text-gray-400 text-xs sm:text-sm">© {new Date().getFullYear()} Edapt. All rights reserved.</p>
                  <div className="flex space-x-4 sm:space-x-6 mt-3 md:mt-0">
                    <a href="#" className="text-gray-400 hover:text-white text-xs sm:text-sm transition">Privacy Policy</a><a href="#" className="text-gray-400 hover:text-white text-xs sm:text-sm transition">Terms of Service</a>
                  </div>
                </div>
              </div>
            </div>
          </footer>
        </div>
      );
    };

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App />);
  </script>
</body>
</html>
